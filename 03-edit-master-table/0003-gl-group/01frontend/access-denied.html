<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ไม่มีสิทธิ์เข้าถึง · Chememan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#00522C; --ink:#0B1A12; --ink-2:#3F4D45; --ink-3:#7A867E; --paper:#F7F5EF; --sans:'IBM Plex Sans',-apple-system,sans-serif; --serif:'Instrument Serif',Georgia,serif }
    * { box-sizing:border-box; margin:0; padding:0 }
    body { font-family:var(--sans); background:var(--paper); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:40px 24px }
    .card { text-align:center; max-width:420px }
    .code { font-family:var(--serif); font-size:clamp(72px,15vw,120px); line-height:1; color:var(--accent); opacity:.18; font-weight:400 }
    h1 { font-family:var(--serif); font-size:28px; font-weight:400; margin-top:8px }
    h1 em { font-style:italic; color:var(--accent) }
    p { font-size:14px; color:var(--ink-2); margin-top:12px; line-height:1.6 }
    .btn { display:inline-flex; align-items:center; gap:8px; margin-top:28px; padding:10px 20px; border-radius:9px; border:1px solid rgba(0,0,0,.12); background:#fff; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; text-decoration:none; transition:all 160ms }
    .btn:hover { border-color:var(--ink); transform:translateY(-1px) }
    .btn svg { width:14px; height:14px }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>ไม่มีสิทธิ์<em>เข้าถึง</em></h1>
    <p>หน้านี้สำหรับผู้ดูแลระบบ Master Table เท่านั้น<br>หากต้องการสิทธิ์การเข้าถึง กรุณาติดต่อทีม Data Engineering</p>
    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      กลับหน้าหลัก
    </a>
  </div>
</body>
</html>
