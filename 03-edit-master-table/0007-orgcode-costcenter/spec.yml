# Spec for 0007 Orgcode-CostCenter Master
# Junction table — many-to-many mapping

page_id: "0007-orgcode-costcenter"

entity:
  name: orgcode_costcenter
  display_th: "Orgcode & Cost Center"
  display_en: "Orgcode & Cost Center"
  pk: [cost_center, orgcode]      # ⚠️ composite PK 2 columns

# No dimension_tables — junction table doesn't have inline-create-new

reference_data:
  - source_table: cfg_master.sap_orgcode_ref
    columns: [code, name]
    used_in: orgcode

validation:
  - column: cost_center
    type: regex
    rule: "^[0-9A-Z]+$"
    auto_transform: upper

api:
  base_path: /api/master/orgcode-costcenter
  endpoints: [list, save, delete]

routing:
  page_url: /master/orgcode
  required_role: master-table-admins
