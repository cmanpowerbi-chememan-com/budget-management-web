name: Deploy 0008 Hide Document Number Master

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/0008-hide-document.yml'
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Lint + Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov bandit
      - name: Ruff (lint)
        working-directory: ./backend
        run: ruff check .
      - name: Bandit (security scan)
        working-directory: ./backend
        run: bandit -r . -ll
      - name: Pytest
        working-directory: ./backend
        run: pytest ../tests --cov=. --cov-fail-under=80

  deploy:
    name: Deploy to Static Web Apps
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://web.chememan.com
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          api_location: 'backend'
          output_location: ''
          config_file_location: 'deploy'
