name: 0003 GL Group — Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - '03-edit-master-table/0003-gl-group/**'
      - '.github/workflows/0003-gl-group-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - '03-edit-master-table/0003-gl-group/**'

env:
  MODULE: 03-edit-master-table/0003-gl-group

jobs:
  # ── Unit tests (no DB required) ───────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.MODULE }}/02backend/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.MODULE }}/02backend
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        working-directory: ${{ env.MODULE }}/04tests
        run: python -m pytest test_merge_logic.py test_handlers.py -v --tb=short

  # ── Integration tests (real Fabric SQL, secrets required) ─
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    # Only run when secrets are available (skipped on fork PRs)
    if: vars.RUN_INTEGRATION_TESTS == 'true'
    env:
      AAD_TENANT_ID:       ${{ secrets.FABRIC_AAD_TENANT_ID }}
      AAD_AUDIENCE:        ${{ secrets.FABRIC_AAD_CLIENT_ID }}
      AAD_CLIENT_ID:       ${{ secrets.FABRIC_AAD_CLIENT_ID }}
      AAD_CLIENT_SECRET:   ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
      FABRIC_SQL_SERVER:   ${{ secrets.FABRIC_SQL_SERVER }}
      FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.MODULE }}/02backend/requirements.txt

      - name: Install ODBC Driver 17
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update -q
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql17 unixodbc-dev

      - name: Install dependencies
        working-directory: ${{ env.MODULE }}/02backend
        run: pip install -r requirements.txt pytest

      - name: Run integration tests
        working-directory: ${{ env.MODULE }}/04tests
        run: python -m pytest test_integration.py -v -s

  # ── Deploy to Azure Static Web Apps ───────────────────────
  deploy:
    name: Deploy
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_0003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location:    ${{ env.MODULE }}/01frontend
          api_location:    ${{ env.MODULE }}/02backend
          output_location: ''
          config_file_location: ${{ env.MODULE }}/05deploy
