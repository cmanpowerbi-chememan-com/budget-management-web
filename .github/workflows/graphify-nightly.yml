name: Nightly Graphify Knowledge Graph

on:
  schedule:
    - cron: "0 20 * * *"  # 03:00 Bangkok (UTC+7) every day
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  build-graph:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install graphifyy==0.8.39 python-dotenv==1.0.1 requests==2.32.4

      - name: Build knowledge graph
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: python graphify-out/_build_graph.py

      - name: Commit and push graph outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/graph.html || true
          git diff --staged --quiet || (git commit -m "chore(graphify): nightly knowledge graph update $(date -u +'%Y-%m-%d') [skip ci]" && git push)

      - name: Send success email notification
        env:
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import base64, os, sys, datetime, requests

          SENDER = "jakkaritw@chememan.com"
          RECIPIENT = "jakkaritw@chememan.com"
          TENANT_ID = os.environ["ENTRA_TENANT_ID"]
          CLIENT_ID = os.environ["ENTRA_CLIENT_ID"]
          CLIENT_SECRET = os.environ["ENTRA_CLIENT_SECRET"]

          # Acquire access token via client_credentials
          token_url = f"https://login.microsoftonline.com/{TENANT_ID}/oauth2/v2.0/token"
          token_resp = requests.post(token_url, data={
              "grant_type": "client_credentials",
              "client_id": CLIENT_ID,
              "client_secret": CLIENT_SECRET,
              "scope": "https://graph.microsoft.com/.default",
          })
          token_resp.raise_for_status()
          access_token = token_resp.json()["access_token"]

          # Build BKK timestamp (UTC+7)
          bkk_now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=7)
          bkk_str = bkk_now.strftime("%Y-%m-%d %H:%M") + " BKK"

          # Read and encode report attachment
          report_path = "graphify-out/GRAPH_REPORT.md"
          try:
              with open(report_path, "rb") as f:
                  report_b64 = base64.b64encode(f.read()).decode()
              attachment_name = "GRAPH_REPORT.md"
          except FileNotFoundError:
              report_b64 = None

          subject = f"[Graphify] Knowledge graph updated — {bkk_str}"
          body_html = f"""
          <p>The nightly Graphify knowledge graph build completed successfully.</p>
          <ul>
            <li><strong>Time:</strong> {bkk_str}</li>
            <li><strong>Outputs:</strong> graph.json, GRAPH_REPORT.md, graph.html committed to repo</li>
          </ul>
          <p>GRAPH_REPORT.md is attached for review.</p>
          """

          attachments = []
          if report_b64:
              attachments.append({
                  "@odata.type": "#microsoft.graph.fileAttachment",
                  "name": attachment_name,
                  "contentType": "text/markdown",
                  "contentBytes": report_b64,
              })

          payload = {
              "message": {
                  "subject": subject,
                  "body": {"contentType": "HTML", "content": body_html},
                  "toRecipients": [{"emailAddress": {"address": RECIPIENT}}],
                  "attachments": attachments,
              },
              "saveToSentItems": True,
          }

          send_url = f"https://graph.microsoft.com/v1.0/users/{SENDER}/sendMail"
          resp = requests.post(send_url, json=payload, headers={
              "Authorization": f"Bearer {access_token}",
              "Content-Type": "application/json",
          })
          print(f"sendMail status: {resp.status_code}")
          if resp.status_code not in (200, 202):
              print(resp.text)
              sys.exit(1)
          EOF

      - name: Send failure email notification
        if: failure()
        env:
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import os, sys, datetime, requests

          SENDER = "jakkaritw@chememan.com"
          RECIPIENT = "jakkaritw@chememan.com"
          TENANT_ID = os.environ["ENTRA_TENANT_ID"]
          CLIENT_ID = os.environ["ENTRA_CLIENT_ID"]
          CLIENT_SECRET = os.environ["ENTRA_CLIENT_SECRET"]

          token_url = f"https://login.microsoftonline.com/{TENANT_ID}/oauth2/v2.0/token"
          token_resp = requests.post(token_url, data={
              "grant_type": "client_credentials",
              "client_id": CLIENT_ID,
              "client_secret": CLIENT_SECRET,
              "scope": "https://graph.microsoft.com/.default",
          })
          token_resp.raise_for_status()
          access_token = token_resp.json()["access_token"]

          bkk_now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=7)
          bkk_str = bkk_now.strftime("%Y-%m-%d %H:%M") + " BKK"
          date_str = bkk_now.strftime("%Y-%m-%d")

          subject = f"[Graphify] Build FAILED — {date_str}"
          body_html = f"""
          <p>The nightly Graphify knowledge graph build <strong>failed</strong>.</p>
          <ul>
            <li><strong>Time:</strong> {bkk_str}</li>
            <li><strong>Repo:</strong> budget-management-web</li>
          </ul>
          <p>Check the GitHub Actions run for details:
          <a href="https://github.com/cmanpowerbi-chememan-com/budget-management-web/actions">
          View Actions</a></p>
          """

          payload = {
              "message": {
                  "subject": subject,
                  "body": {"contentType": "HTML", "content": body_html},
                  "toRecipients": [{"emailAddress": {"address": RECIPIENT}}],
                  "attachments": [],
              },
              "saveToSentItems": True,
          }

          send_url = f"https://graph.microsoft.com/v1.0/users/{SENDER}/sendMail"
          resp = requests.post(send_url, json=payload, headers={
              "Authorization": f"Bearer {access_token}",
              "Content-Type": "application/json",
          })
          print(f"failure email status: {resp.status_code}")
          if resp.status_code not in (200, 202):
              print(resp.text)
              sys.exit(1)
          EOF
