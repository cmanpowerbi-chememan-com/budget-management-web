name: Daily Employee Sync

on:
  schedule:
    - cron: "0 23 * * *"  # 06:00 Bangkok (UTC+7) every day
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install pyodbc requests python-dotenv

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Whitelist runner IP in Azure SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create \
            --resource-group CMAN-BUDGET-MNGT-WEB-RG \
            --server cman-budget-mngt-web-sql \
            --name github-actions-runner \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Run employee sync
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CPOP_HR_SYSTEM_API_URL: ${{ secrets.CPOP_HR_SYSTEM_API_URL }}
          CPOP_HR_SYSTEM_API_KEY: ${{ secrets.CPOP_HR_SYSTEM_API_KEY }}
        run: python setup/sync_employees.py

      - name: Remove runner IP from Azure SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group CMAN-BUDGET-MNGT-WEB-RG \
            --server cman-budget-mngt-web-sql \
            --name github-actions-runner \
            --yes
