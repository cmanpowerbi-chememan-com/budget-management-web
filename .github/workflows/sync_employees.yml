name: Daily Employee Sync

on:
  schedule:
    - cron: "0 23 * * *"  # 06:00 Bangkok (UTC+7) every day
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install pyodbc requests python-dotenv

      - name: Run employee sync
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
          CPOP_HR_SYSTEM_API_URL: ${{ secrets.CPOP_HR_SYSTEM_API_URL }}
          CPOP_HR_SYSTEM_API_KEY: ${{ secrets.CPOP_HR_SYSTEM_API_KEY }}
        run: python setup/sync_employees.py
