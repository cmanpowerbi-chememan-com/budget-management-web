# Officer Review Weekly — PRD #34 (issue #34).
#
# Purpose: runs daily at 04:40 Bangkok time (PRD #36 — moved from 07:10 to
# absorb GitHub's own scheduling lag; see the schedule note below). A
# SCHEDULED run only proceeds on a Friday (Bangkok), or on any day up to the
# DAILY WINDOW date below; on other days it skips after the guard step (no
# build, no publish, no mail) and exits green. A run that proceeds builds the
# officer-review budget workbook from live production data, gates it on the
# file=web=Fabric reconcile, and — only on a live run — overwrites ONE file in
# the `officer review/` SharePoint folder and mails the budget officers ONE
# link mail (To the first recipient, cc the rest). A FAILed reconcile
# publishes nothing and mails nothing (see backend/app/officer_reconcile.py +
# backend/jobs/officer_review.py).
#
# KILL SWITCH: delete the repo variable OFFICER_REVIEW_LIVE, or set it to
# false — no commit, no redeploy. That takes the SCHEDULE back to a preview
# only; a human can still reach a real run via workflow_dispatch `execute`.
#
# DAILY WINDOW: set the repo variable OFFICER_REVIEW_DAILY_UNTIL=YYYY-MM-DD
# to run every day up to and including that Bangkok date (e.g. the
# submission deadline); unset, malformed or past -> back to Friday only. No
# commit needed. workflow_dispatch runs are never skipped by this guard.
#
# Required secrets: FABRIC_SQL_SERVER, FABRIC_SQL_DATABASE, GOLD_SQL_SERVER,
# GOLD_SQL_DATABASE, FABRIC_AAD_CLIENT_ID, FABRIC_AAD_CLIENT_SECRET,
# FABRIC_AAD_TENANT_ID (GOLD_SQL_* did not exist as repo secrets at the time
# this workflow was written — jakkaritw must add them before the schedule or
# any real run can succeed; see the ADR), OFFICER_REVIEW_RECIPIENTS
# (comma/semicolon-separated email list — a SECRET, not a variable, because
# this repo is PUBLIC and repo variables are shown in plain text on every
# Actions run page; a REAL run with none configured FAILs before publishing,
# never sends nothing silently — fix round 2026-09-24, R3).
# Required vars: AUTOMATION_FISCAL_YEAR (shared with budget-automations.yml),
# OFFICER_REVIEW_LIVE (kill switch, unset/false = schedule stays PREVIEW),
# OFFICER_REVIEW_DAILY_UNTIL (optional, YYYY-MM-DD daily-window end date,
# unset = Friday only).
#
# This workflow is DELIBERATELY separate from budget-automations.yml (PRD
# story 29) — reminders are ARMED for real sends 30 Sep-15 Oct 2026, and this
# robot's gates (OFFICER_REVIEW_LIVE) must never be coupled to that one's
# (REMINDERS_LIVE / NOTIFICATIONS_DRY_RUN).
#
# NOTE: a GitHub `schedule:` trigger only fires from the default branch AFTER
# this file is pushed to main — nothing runs until that push is approved and
# lands. GitHub Actions delays scheduled runs under platform load — this
# repo's own 55-day history (nightly automation workflow, 2026-08-01 to
# 2026-09-24) shows a median start lag of about 2 hours (p90 about 3 hours,
# max about 8 hours), with 0 of those runs dropped; this workflow's own first
# scheduled run (2026-09-25) started 4 h 39 min late. PRD #36 moved the cron
# from 07:10 to 04:40 Bangkok specifically to absorb that lag and still
# usually land before the working day starts (the cron now fires daily at
# 04:40; the guard step turns non-window days into a no-op) — it is not
# guaranteed before 07:10 on every run. A manual workflow_dispatch starts
# within seconds and is the fallback for a late or dropped run.
name: Officer Review Weekly

on:
  schedule:
    - cron: "40 21 * * *"  # daily 21:40 UTC = 04:40 Bangkok (UTC+7) — PRD #36; the guard step decides whether a scheduled run proceeds (Friday always; other days only up to OFFICER_REVIEW_DAILY_UNTIL)
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Planning fiscal year (blank -> falls back to the AUTOMATION_FISCAL_YEAR repo variable)"
        required: false
        type: string
      execute:
        description: "Actually publish + mail (unchecked = dry-run preview only, unless OFFICER_REVIEW_LIVE is on for a scheduled run)"
        required: false
        type: boolean
        default: false
      probe:
        description: "Run the read-only permission probe only (Fabric/gold read, Graph token roles, site/drive/folder resolution) — no build, no write"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: officer-review
  cancel-in-progress: false

jobs:
  officer-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FISCAL_YEAR: ${{ inputs.fiscal_year || vars.AUTOMATION_FISCAL_YEAR }}
      # SEC-F6/OPS-6/SPEC-10 fix round 2026-09-24: dispatch inputs + the
      # event name are passed through `env:` and referenced as quoted shell
      # vars everywhere below — never inlined as `${{ inputs.* }}` inside a
      # `run:` script (that pattern lets a free-text input get word-split
      # into extra args/flags).
      EXECUTE_INPUT: ${{ inputs.execute }}
      PROBE_INPUT: ${{ inputs.probe }}
      EVENT_NAME: ${{ github.event_name }}
      DAILY_UNTIL: ${{ vars.OFFICER_REVIEW_DAILY_UNTIL }}

    steps:
      - name: Daily window guard (scheduled runs only)
        id: window
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%F)
          DOW=$(TZ=Asia/Bangkok date +%u)
          if [ "$EVENT_NAME" != "schedule" ]; then
            RUN=true
            REASON="manual dispatch"
          else
            DAILY_UNTIL="${DAILY_UNTIL//[[:space:]]/}"
            if [ -n "$DAILY_UNTIL" ] && [[ ! "$DAILY_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::warning::OFFICER_REVIEW_DAILY_UNTIL is not YYYY-MM-DD — treating it as unset (Friday only)."
              DAILY_UNTIL=""
            fi
            if [ "$DOW" = "5" ]; then
              RUN=true
              REASON="weekly Friday run"
            elif [ -n "$DAILY_UNTIL" ] && ! [[ "$TODAY" > "$DAILY_UNTIL" ]]; then
              RUN=true
              REASON="daily window (up to and including $DAILY_UNTIL)"
            else
              RUN=false
              REASON="outside the daily window"
              echo "::notice::Bangkok date $TODAY is outside the daily window — skipping (no publish, no mail)."
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Window decision: TODAY=$TODAY DOW=$DOW DAILY_UNTIL=${DAILY_UNTIL:-unset} event=$EVENT_NAME run=$RUN — $REASON"

      - name: Checkout code
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Resolve fiscal year (fail loudly rather than act on the wrong year)
        if: steps.window.outputs.run == 'true'
        run: |
          if [ -z "$FISCAL_YEAR" ]; then
            echo "::error::No planning fiscal year. Pass the workflow_dispatch input, or set the AUTOMATION_FISCAL_YEAR repo variable for scheduled runs."
            exit 1
          fi
          if [[ ! "$FISCAL_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::FISCAL_YEAR ('$FISCAL_YEAR') is not exactly 4 digits — refusing to act on it (SEC-F6: word-splitting / bad-input guard)."
            exit 1
          fi
          echo "Acting on planning fiscal year: $FISCAL_YEAR (execute=$EXECUTE_INPUT, probe=$PROBE_INPUT)"

      - name: Install ODBC Driver 17 for SQL Server
        if: steps.window.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: steps.window.outputs.run == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: "Probe: permissions + connectivity (read-only)"
        if: steps.window.outputs.run == 'true' && inputs.probe == true
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          GOLD_SQL_SERVER: ${{ secrets.GOLD_SQL_SERVER }}
          GOLD_SQL_DATABASE: ${{ secrets.GOLD_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: python -m jobs.officer_review --fiscal-year "$FISCAL_YEAR" --probe

      - name: Build + reconcile + (real run only) publish and mail
        if: steps.window.outputs.run == 'true' && inputs.probe != true
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          GOLD_SQL_SERVER: ${{ secrets.GOLD_SQL_SERVER }}
          GOLD_SQL_DATABASE: ${{ secrets.GOLD_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
          OFFICER_REVIEW_LIVE: ${{ vars.OFFICER_REVIEW_LIVE }}
          # R3 fix round 2026-09-24: `secrets.`, not `vars.` — this repo is
          # PUBLIC, and a repo VARIABLE's value is shown in plain text on
          # every Actions run page (preview runs included); a SECRET is
          # masked. `OFFICER_REVIEW_LIVE` stays a var — it only ever holds
          # true/false, never an address list.
          OFFICER_REVIEW_RECIPIENTS: ${{ secrets.OFFICER_REVIEW_RECIPIENTS }}
        run: |
          case "${OFFICER_REVIEW_LIVE,,}" in
            true|1|yes|on|y|t) LIVE_ON=true ;;
            *) LIVE_ON=false ;;
          esac
          # SEC-F6/OPS-6/SPEC-10: quoted shell vars only (never an inlined
          # GitHub Actions "inputs.*" expression in this script — see the
          # `env:` block above), and the CLI args are built as a bash ARRAY,
          # never a word-split string, so a free-text fiscal_year can never
          # inject extra flags.
          if [ "$EXECUTE_INPUT" = "true" ] || { [ "$LIVE_ON" = "true" ] && [ "$EVENT_NAME" = "schedule" ]; }; then
            export DRY_RUN=false
            MODE=REAL
            if [ "$EXECUTE_INPUT" = "true" ]; then REASON="manual execute input"; else REASON="schedule variable OFFICER_REVIEW_LIVE=on"; fi
          else
            export DRY_RUN=true
            MODE=PREVIEW
            REASON="neither manual execute nor (schedule AND OFFICER_REVIEW_LIVE=on)"
          fi
          echo "MODE: $MODE — reason: $REASON | execute=$EXECUTE_INPUT, OFFICER_REVIEW_LIVE=$OFFICER_REVIEW_LIVE (parsed=$LIVE_ON), DRY_RUN=$DRY_RUN, event=$EVENT_NAME"
          ARGS=(--fiscal-year "$FISCAL_YEAR")
          if [ "$MODE" = "REAL" ]; then
            ARGS+=(--execute)
          fi
          python -m jobs.officer_review "${ARGS[@]}"
