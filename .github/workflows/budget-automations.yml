# Cron ENABLED 2026-08-01 (jakkaritw) — see docs/BUILD_PLAN.md A11/A12.
# NOTE (2026-07-28): the FX re-persist job was split into fx-repersist.yml
# (Appendix E decision 3, P0-28) — `execute=true` here can no longer re-price
# per-diem by accident.
# NOTE (2026-08-01, ADR-0027): the 30-day auto-escalate step was REMOVED —
# a stuck step is now advanced only by a human admin step-override
# (POST /approval/override-step); the 7-day turn reminders below never stop.
# GO-LIVE (2026-07-31 email-notify revamp, plan/email-notify-revamp.md §6):
#   1. [DONE 2026-08-01] budget.reminder_log created on the shared DB.
#   2. [DONE 2026-08-01] staging on budget-web:80b0e1c; manual dry-run run
#      30679138743 green on all three steps.
#   3. [DONE 2026-08-01, jakkaritw] cron ENABLED below — the daily run was
#      (and, with nothing configured below, still is) a DRY-RUN PREVIEW ONLY.
#
# CHANGED (2026-09-18, issue #27 — "split automations and parameterise", step
# 2 of the 3-step reminder go-live): the two jobs used to share ONE `execute`
# input (checking it to send a real reminder ALSO let auto-submit write for
# real), and the notification layer's own dry-run flag + redirect override
# never reached this job at all — so even a manual `execute` run sent zero
# mail, silently, which looked like success. Both are fixed:
#
#   GATE 1 — per job, independent, operator-controlled (workflow_dispatch):
#     `execute_auto_submit` drives the "Auto-submit..." (A11) step ONLY.
#     `execute_reminders`   drives the "Send pre-deadline reminders..." (A12)
#     step ONLY. Each input sets BOTH that step's own `--execute` CLI flag
#     AND that step's own `DRY_RUN` env (jobs/common.py's `is_dry_run()` is
#     UNCHANGED — still requires both). A scheduled run supplies neither
#     input, so both steps stay preview, exactly as before this change.
#
#   GATE 2 — mail only, repo VARIABLES (not secrets, not a commit),
#   forwarded to the REMINDERS step ONLY:
#     `NOTIFICATIONS_DRY_RUN`         unset/blank -> 'true' (the same safe
#                                     default Settings.notifications_dry_run
#                                     already has) — Graph sendMail is never
#                                     actually called.
#     `NOTIFICATIONS_REDIRECT_ALL_TO` unset/blank -> normal delivery. When
#                                     set, EVERY reminder in this run goes to
#                                     that one address instead of the real
#                                     recipient — the rehearsal aid.
#     Both are read by THIS JOB'S OWN PROCESS only — independent of whatever
#     NOTIFICATIONS_DRY_RUN is set to on the live Container App (which is a
#     different process and governs real-time submit/approve/reject mail).
#     Neither is forwarded to the auto-submit step's `env:` block. Its own
#     "it's your turn" courtesy mail (`notify_turn`) is NOT governed by the
#     Container App either — a GitHub Actions job cannot read an unrelated
#     Azure Container App's environment. What actually governs it:
#     `jobs/auto_submit.py` also calls `get_settings()`, in THIS SAME CI
#     process, but that step's own `env:` never sets NOTIFICATIONS_DRY_RUN
#     and CI never has backend/.env (gitignored, never in a checkout) — so
#     Settings() falls back to the class default `notifications_dry_run =
#     True`, meaning this courtesy mail is ALWAYS suppressed in CI today,
#     even on a real `--execute` run that writes budget.approval_status
#     rows for real. Making it fire for real would mean adding
#     NOTIFICATIONS_DRY_RUN to the auto-submit step's own `env:` (the same
#     pattern the reminders step already uses below) — never the Container
#     App.
#
#   Exact combinations:
#     (a) PREVIEW (today's default — nothing set, nothing checked):
#         execute_auto_submit=false, execute_reminders=false. Zero writes,
#         zero mail — unchanged from before this change.
#     (b) REHEARSAL — a real Graph send, to one test address only:
#         execute_reminders=true (workflow_dispatch, checked) AND repo
#         variable NOTIFICATIONS_DRY_RUN=false AND repo variable
#         NOTIFICATIONS_REDIRECT_ALL_TO=<test address>. reminder_log is
#         still written for real, but every mail lands on that one address.
#     (c) REAL SEND — real recipients:
#         execute_reminders=true AND repo variable NOTIFICATIONS_DRY_RUN=false
#         AND NOTIFICATIONS_REDIRECT_ALL_TO unset/blank.
#     execute_auto_submit is entirely independent of (a)/(b)/(c) — set it on
#     its own to make A11 write for real while reminders stays a preview,
#     and vice versa.
#
# PROBE (2026-09-19, issue #28 — "prove the CI runner can actually send mail
# before the 2026-09-30 real send"): a workflow_dispatch-only, opt-in step
# "Probe: can this runner send mail?" runs BEFORE the two automation steps
# below, gated on its own boolean input (`probe_graph`, default false) — a
# scheduled run and an ordinary manual run never execute it, so it changes
# nothing about today's behaviour. When jakkaritw checks the box, it fetches
# a Graph token with THIS RUNNER'S OWN `secrets.FABRIC_AAD_*` credentials
# (same env block as the two steps below — one source of truth, no separate
# copy to drift), decodes the token's `roles` claim locally (no signature
# check, no other Graph call), and prints PASS/FAIL on whether Mail.Send is
# present. Deliberately no `continue-on-error` — the result IS the point, it
# must show as a visible red X, not get swallowed. Answers the one link
# nothing else in this workflow has ever proven: every mail sent so far
# (incl. the 2026-09-18 preview pair) went out from the developer's own
# `backend/.env` credentials, never these repo secrets.
name: Budget Automations (auto-submit / reminders)

on:
  schedule:
    - cron: "0 20 * * *"  # 03:00 Bangkok (UTC+7) daily — dry-run preview until the flips above
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Planning fiscal year to act on (blank on a scheduled run -> falls back to the AUTOMATION_FISCAL_YEAR repo variable; never auto-detected from the clock)"
        required: false
        type: string
      execute_auto_submit:
        description: "Actually auto-submit true-DRAFT departments (A11 step only). Unchecked = dry-run preview only. Independent of execute_reminders."
        required: false
        type: boolean
        default: false
      execute_reminders:
        description: "Actually send pre-deadline reminder mail (A12 step only). Unchecked = dry-run preview only. Independent of execute_auto_submit. A real send ALSO needs the NOTIFICATIONS_DRY_RUN repo variable set to 'false' — see the header comment above."
        required: false
        type: boolean
        default: false
      probe_graph:
        description: "Run the read-only 'can this runner send mail?' probe before the two automation steps (issue #28). Fetches a Graph token with this runner's own credentials and checks for the Mail.Send app role — sends no mail, writes nothing. Unchecked (default) = step does not run at all, incl. on the nightly schedule."
        required: false
        type: boolean
        default: false

jobs:
  automations:
    runs-on: ubuntu-22.04
    env:
      # DRY_RUN moved OUT of this shared job-level env (2026-09-18, issue #27)
      # — it is now computed PER STEP, inside each step's own `run:` script,
      # from that step's own execute_auto_submit / execute_reminders input.
      # See the header comment above for the full gate list.
      #
      # Deep links in every mail (ADR-0016). Without this the jobs fall back to
      # the placeholder https://budget.chememan.com, which does not resolve —
      # every link in a reminder would be dead. Held in the repo VARIABLE
      # APP_BASE_URL (not a secret) so the staging -> production switch at
      # go-live is a variable edit, not a commit. Currently: staging FQDN.
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      # A scheduled run carries NO inputs, so `inputs.fiscal_year` is empty and
      # the old `--fiscal-year ${{ inputs.fiscal_year }}` would have died with
      # an argparse error every night. The year comes from the repo VARIABLE
      # AUTOMATION_FISCAL_YEAR instead — still explicit and human-set (never
      # derived from the clock), and a manual run's input overrides it.
      FISCAL_YEAR: ${{ inputs.fiscal_year || vars.AUTOMATION_FISCAL_YEAR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve fiscal year (fail loudly rather than act on the wrong year)
        run: |
          if [ -z "$FISCAL_YEAR" ]; then
            echo "::error::No planning fiscal year. Pass the workflow_dispatch input, or set the AUTOMATION_FISCAL_YEAR repo variable for scheduled runs."
            exit 1
          fi
          echo "Acting on planning fiscal year: $FISCAL_YEAR (execute_auto_submit=${{ inputs.execute_auto_submit }}, execute_reminders=${{ inputs.execute_reminders }})"

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: "Probe: can this runner send mail?"
        if: inputs.probe_graph == true
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        # Deliberately no continue-on-error — a FAIL here must land as a red
        # X on the run, never get swallowed (issue #28: the whole point is a
        # visible answer to "can this runner send mail today?").
        run: python -m jobs.probe_graph_permissions

      - name: Auto-submit true-DRAFT departments at deadline (A11)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year $FISCAL_YEAR"
          if [ "${{ inputs.execute_auto_submit }}" = "true" ]; then
            export DRY_RUN=false
            ARGS="$ARGS --execute"
            MODE=REAL
          else
            export DRY_RUN=true
            MODE=PREVIEW
          fi
          echo "MODE: $MODE auto-submit (A11) — execute_auto_submit=${{ inputs.execute_auto_submit }}, DRY_RUN=$DRY_RUN"
          python -m jobs.auto_submit $ARGS

      - name: Send pre-deadline reminders to Fillers (A12 automation D)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
          # A12-only mail switches (repo variables, not secrets — issue #27
          # gate 2, see the header comment). Unset -> the same safe defaults
          # Settings already has (dry-run true, no redirect): today's
          # behaviour is unchanged until jakkaritw sets these.
          NOTIFICATIONS_DRY_RUN: ${{ vars.NOTIFICATIONS_DRY_RUN || 'true' }}
          NOTIFICATIONS_REDIRECT_ALL_TO: ${{ vars.NOTIFICATIONS_REDIRECT_ALL_TO }}
        run: |
          ARGS="--fiscal-year $FISCAL_YEAR"
          if [ "${{ inputs.execute_reminders }}" = "true" ]; then
            export DRY_RUN=false
            ARGS="$ARGS --execute"
            MODE=REAL
          else
            export DRY_RUN=true
            MODE=PREVIEW
          fi
          # This line must never claim "suppressed" while jobs.send_reminders
          # (which reads the SAME NOTIFICATIONS_DRY_RUN via pydantic-settings,
          # backend/app/config.py Settings.notifications_dry_run) is about to
          # send real mail. pydantic-core's lax bool parser is case-INsensitive
          # and accepts more than the literal word "false" — verified
          # empirically 2026-09-19 against this backend's installed
          # pydantic==2.13.3 / pydantic_core==2.46.3 (pydantic-settings is
          # pinned backend/requirements.txt): false/no/0/off/f/n all parse to
          # False (real mail, NOT suppressed); anything else either parses to
          # True (suppressed) or is invalid and crashes Settings() before any
          # send (no mail either way). A single case-sensitive `= "false"`
          # compare (the old bash here) disagreed with Python on "False"/
          # "FALSE"/"no"/"0"/"off"/"f"/"n" — match the same token set instead.
          case "${NOTIFICATIONS_DRY_RUN,,}" in
            false|no|0|off|f|n) MAIL="NOT suppressed" ;;
            *) MAIL="suppressed" ;;
          esac
          if [ -n "$NOTIFICATIONS_REDIRECT_ALL_TO" ]; then REDIRECT="ALL mail -> $NOTIFICATIONS_REDIRECT_ALL_TO"; else REDIRECT="off (real recipients)"; fi
          echo "MODE: $MODE reminders (A12) — execute_reminders=${{ inputs.execute_reminders }}, DRY_RUN=$DRY_RUN | mail: $MAIL | redirect: $REDIRECT"
          python -m jobs.send_reminders $ARGS
