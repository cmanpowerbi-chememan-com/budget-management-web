# enable cron at go-live after jakkaritw approval (A14) — see docs/BUILD_PLAN.md A11/A12.
# Until then: workflow_dispatch (manual) ONLY. The cron schedule below is
# intentionally commented out, and DRY_RUN defaults 'true' as a second,
# independent safety layer (jobs/common.py: --execute alone is not enough —
# DRY_RUN must ALSO be explicitly 'false'). Real email sends are additionally
# gated by Settings.notifications_dry_run (backend/app/config.py, default True).
name: Budget Automations (auto-submit / auto-escalate / reminders / fx-repersist)

on:
  # schedule:
  #   - cron: "0 20 * * *"  # 03:00 Bangkok (UTC+7) daily — COMMENTED OUT until go-live approval
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Planning fiscal year to act on (no auto-detect — always explicit)"
        required: true
        type: string
      execute:
        description: "Actually write/send (unchecked = dry-run preview only)"
        required: false
        type: boolean
        default: false

jobs:
  automations:
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: 'true' # belt-and-braces default — jobs ALSO require --execute (jobs/common.py)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Auto-submit true-DRAFT departments at deadline (A11)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year ${{ inputs.fiscal_year }}"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          python -m jobs.auto_submit $ARGS

      - name: Auto-escalate stale approvals, 30-day SLA (A11)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year ${{ inputs.fiscal_year }}"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          python -m jobs.auto_escalate $ARGS

      - name: Send pre-deadline reminders to Fillers (A12 automation D)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year ${{ inputs.fiscal_year }}"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          python -m jobs.send_reminders $ARGS

      - name: FX reconciliation — re-persist per-diem after a master-currency FX change (GATE 2026-07-24)
        # RUNBOOK: run this AFTER the Master Currency SharePoint->Fabric sync
        # (NB_budget_masters_sync, workspace cman-dw-ws) has landed the new
        # dbo.master_currency_rate row for fiscal_year — running it before the
        # sync just re-persists the OLD rate (harmless, but the "update" won't
        # show yet). No cron here either — manual click only, same as the jobs above.
        # BACKLOG (not built here): have that sync notebook fire a GitHub
        # repository_dispatch to auto-trigger this step instead of a manual
        # click (docs/specs/feature-fx-repersist-perdiem.md §5, alternative (i)).
        # NOTE: unlike the 3 jobs above, this job's CLI flag is `--run` (not
        # `--execute`) and it does NOT read the DRY_RUN env var — dry-run is
        # controlled ONLY by omitting `--run` (see jobs/repersist_perdiem_fx.py).
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year ${{ inputs.fiscal_year }}"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --run"; fi
          python -m jobs.repersist_perdiem_fx $ARGS
