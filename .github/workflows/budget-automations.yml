# Cron ENABLED 2026-08-01 (jakkaritw) — see docs/BUILD_PLAN.md A11/A12.
# THREE INDEPENDENT GATES still stand between this schedule and a real write or
# a real email, and the daily run currently trips the first two:
#   1. `--execute` — a scheduled run carries no inputs, so the flag is never added.
#   2. `DRY_RUN: 'true'` below — jobs/common.py forces preview mode unless this
#      is explicitly 'false', so even a manual run with --execute stays dry.
#   3. Settings.notifications_dry_run (backend/app/config.py, default True) —
#      send_mail constructs and logs the payload but makes zero HTTP calls.
# So: the schedule exercises the queries nightly and writes/sends NOTHING.
# NOTE (2026-07-28): the FX re-persist job was split into fx-repersist.yml
# (Appendix E decision 3, P0-28) — `execute=true` here can no longer re-price
# per-diem by accident.
# NOTE (2026-08-01, ADR-0027): the 30-day auto-escalate step was REMOVED —
# a stuck step is now advanced only by a human admin step-override
# (POST /approval/override-step); the 7-day turn reminders below never stop.
# GO-LIVE (2026-07-31 email-notify revamp, plan/email-notify-revamp.md §6):
#   1. [DONE 2026-08-01] budget.reminder_log created on the shared DB.
#   2. [DONE 2026-08-01] staging on budget-web:80b0e1c; manual dry-run run
#      30679138743 green on all three steps.
#   3. [DONE 2026-08-01, jakkaritw] cron ENABLED below — but the daily run is a
#      DRY-RUN PREVIEW ONLY. Nothing is written and no mail is sent, because
#      the schedule passes no `--execute` AND `DRY_RUN` stays 'true' AND
#      Settings.notifications_dry_run is still True on the Container App.
#      Going truly live = a separate jakkaritw decision: set DRY_RUN below to
#      'false' + add `--execute` for scheduled runs, and set
#      NOTIFICATIONS_DRY_RUN=false on the Container App.
name: Budget Automations (auto-submit / reminders)

on:
  schedule:
    - cron: "0 20 * * *"  # 03:00 Bangkok (UTC+7) daily — dry-run preview until the flips above
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Planning fiscal year to act on (blank on a scheduled run -> falls back to the AUTOMATION_FISCAL_YEAR repo variable; never auto-detected from the clock)"
        required: false
        type: string
      execute:
        description: "Actually write/send (unchecked = dry-run preview only)"
        required: false
        type: boolean
        default: false

jobs:
  automations:
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: 'true' # belt-and-braces default — jobs ALSO require --execute (jobs/common.py)
      # Deep links in every mail (ADR-0016). Without this the jobs fall back to
      # the placeholder https://budget.chememan.com, which does not resolve —
      # every link in a reminder would be dead. Held in the repo VARIABLE
      # APP_BASE_URL (not a secret) so the staging -> production switch at
      # go-live is a variable edit, not a commit. Currently: staging FQDN.
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      # A scheduled run carries NO inputs, so `inputs.fiscal_year` is empty and
      # the old `--fiscal-year ${{ inputs.fiscal_year }}` would have died with
      # an argparse error every night. The year comes from the repo VARIABLE
      # AUTOMATION_FISCAL_YEAR instead — still explicit and human-set (never
      # derived from the clock), and a manual run's input overrides it.
      FISCAL_YEAR: ${{ inputs.fiscal_year || vars.AUTOMATION_FISCAL_YEAR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve fiscal year (fail loudly rather than act on the wrong year)
        run: |
          if [ -z "$FISCAL_YEAR" ]; then
            echo "::error::No planning fiscal year. Pass the workflow_dispatch input, or set the AUTOMATION_FISCAL_YEAR repo variable for scheduled runs."
            exit 1
          fi
          echo "Acting on planning fiscal year: $FISCAL_YEAR (execute=${{ inputs.execute }}, DRY_RUN=$DRY_RUN)"

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Auto-submit true-DRAFT departments at deadline (A11)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year $FISCAL_YEAR"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          python -m jobs.auto_submit $ARGS

      - name: Send pre-deadline reminders to Fillers (A12 automation D)
        working-directory: backend
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          ENTRA_CLIENT_ID: ${{ secrets.FABRIC_AAD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.FABRIC_AAD_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.FABRIC_AAD_TENANT_ID }}
        run: |
          ARGS="--fiscal-year $FISCAL_YEAR"
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          python -m jobs.send_reminders $ARGS
